<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ebe8e2" data-light="#ebe8e2" data-dark="#1c1c1a">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1a" data-light="#ebe8e2" data-dark="#1c1c1a">
  <meta name="color-scheme" content="light dark">
  <script>
    {
      const theme = localStorage.getItem("agents.theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
        for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = meta.dataset[theme];
        document.querySelector('meta[name="color-scheme"]').content = theme;
      }
    }
  </script>
  <title>Agents</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/HankenGrotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-shell" viewBox="0 0 24 24"><path d="M4 7l5 5-5 5M12 17h8"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-enter" viewBox="0 0 24 24"><path d="M19 5v7a3 3 0 0 1-3 3H6M10 11l-4 4 4 4"/></symbol>
      <symbol id="i-tab" viewBox="0 0 24 24"><path d="M4 12h12M12 8l4 4-4 4M20 6v12"/></symbol>
      <symbol id="i-sending" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-picture" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 2.5-2.5L20 18"/></symbol>
      <symbol id="i-latest" viewBox="0 0 24 24"><path d="M12 5v12M7 12l5 5 5-5M6 20h12"/></symbol>
      <symbol id="i-theme-system" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
      <symbol id="i-theme-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-theme-dark" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 15 6 10zM10 20a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 15 6 10zM10 20a2 2 0 0 0 4 0M4 4l16 16"/></symbol>
      <symbol id="i-offline" viewBox="0 0 24 24"><path d="M4 4l16 16M9 17.5a4 4 0 0 1 6 0M5.5 13.5a9 9 0 0 1 4-2.3M14.5 11.2a9 9 0 0 1 4 2.3M2.5 9.5a13 13 0 0 1 5-2.9M12 6a13 13 0 0 1 9.5 3.5"/></symbol>
    </defs>
  </svg>

  <main id="app" class="app"></main>
  <div id="switcher-root" class="switcher-layer" hidden></div>
  <div id="notify-root" class="switcher-layer" hidden></div>
  <div id="picture-root" class="picture-layer" hidden></div>

  <noscript><p class="noscript">This app needs JavaScript to talk to your laptop.</p></noscript>
</body>
</html>
